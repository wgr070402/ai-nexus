name: ai_nexus
description: AI Nexus - 单聊 + 群聊(多智能体) + 终端 + 四引擎 的 Android AI 应用
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 路由
  go_router: ^14.2.0
  # 网络
  dio: ^5.4.0
  # 本地存储
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.2
  # UI / 渲染
  flutter_markdown: ^0.7.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
